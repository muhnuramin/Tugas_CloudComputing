services:
  # -------------------------------------------------------------
  # App Service: PHP 8.4-FPM
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: siakad-app:latest
    container_name: siakad-prod-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - siakad-network

  # -------------------------------------------------------------
  # Web Service: Nginx Reverse Proxy
  # -------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: siakad-prod-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - siakad-network

  # -------------------------------------------------------------
  # Queue Worker: Process asynchronous background jobs
  # -------------------------------------------------------------
  queue:
    image: siakad-app:latest
    container_name: siakad-prod-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - app
      - db
    networks:
      - siakad-network

  # -------------------------------------------------------------
  # Database Service: MySQL 8.0
  # -------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: siakad-prod-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-siakad}
      MYSQL_USER: ${DB_USERNAME:-siakad_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-supersecret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - siakad-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      interval: 10s
      retries: 5

networks:
  siakad-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  app_storage:
    driver: local
  app_public:
    driver: local
